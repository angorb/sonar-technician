[package]
name = "sonar-technician"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.2", default-features = false }

# TLS is only used for the GG discovery call. Windows uses SChannel (no C
# toolchain needed); other platforms (WSL dev/tests) use rustls.
[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
ureq = { version = "3.5.2", default-features = false, features = ["native-tls-no-default"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
